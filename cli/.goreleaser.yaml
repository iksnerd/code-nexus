version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: nexus
    main: .
    binary: nexus
    ldflags:
      - -s -w -X github.com/iksnerd/code-nexus/cli/cmd.Version={{ .Tag }}
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: nexus
    name_template: "nexus_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    files:
      - README.md

checksum:
  name_template: "nexus_checksums.txt"

changelog:
  disable: true

release:
  github:
    owner: iksnerd
    name: code-nexus
  name_template: "CLI {{ .Tag }}"
  # The repo's compose file, for running the server without the CLI.
  extra_files:
    - glob: ../docker-compose.yml
  header: |
    ## CodeNexus CLI {{ .Tag }}

    ### Quick start

    With Docker running, install the CLI below, then in your project:

    ```bash
    nexus init
    ```

    That starts the server, indexes the project and writes `.mcp.json`. To connect Claude Code to a server that is already running:

    ```bash
    claude mcp add --transport http code-nexus http://localhost:3002/mcp
    ```

    No CLI? Download `docker-compose.yml` from this release and run `WORKSPACE=~/projects WORKSPACE_HOST=~/projects docker compose up -d`.

    ### Install

    **macOS (Apple Silicon)**
    ```bash
    curl -L https://github.com/iksnerd/code-nexus/releases/download/{{ .Tag }}/nexus_darwin_arm64.tar.gz | tar xz
    sudo mv nexus /usr/local/bin/
    ```

    **macOS (Intel)**
    ```bash
    curl -L https://github.com/iksnerd/code-nexus/releases/download/{{ .Tag }}/nexus_darwin_amd64.tar.gz | tar xz
    sudo mv nexus /usr/local/bin/
    ```

    **Linux (amd64)**
    ```bash
    curl -L https://github.com/iksnerd/code-nexus/releases/download/{{ .Tag }}/nexus_linux_amd64.tar.gz | tar xz
    sudo mv nexus /usr/local/bin/
    ```
