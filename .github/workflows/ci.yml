name: CI

# Runs only on version tags (and on demand). Everyday commits are gated locally
# by the pre-commit hook in .githooks/ (install with `make hooks`) and the
# pre-push checklist in CLAUDE.md.
#
# v* tag push: test + secret-scan, then build the arm64 image and push
#              iksnerd/code-nexus:vX.Y.Z + :latest to Docker Hub.
# manual run:  same jobs; the image is only pushed when `publish` is ticked.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Push the Docker image to Docker Hub (unticked = build only)"
        type: boolean
        default: false

# Never cancel an in-flight release: a cancelled run can leave :latest and the
# version tag pointing at different images.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  MIX_ENV: test
  ELIXIR_VERSION: "1.19.5"
  OTP_VERSION: "27"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
        options: >-
          --health-cmd "bash -c 'echo > /dev/tcp/localhost/6333'"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - run: mix deps.get
      - run: mix deps.compile
      - run: mix compile --warnings-as-errors
      - run: mix format --check-formatted
      - run: mix test --exclude performance --exclude multi_project --exclude nif --exclude file_watcher
        env:
          QDRANT_URL: http://localhost:6333

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Docker Image
    needs: [test, secret-scan]
    # Native arm64 runner: no QEMU emulation, so the Rust NIF compiles at full speed.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tags
        id: meta
        env:
          PUBLISH_INPUT: ${{ inputs.publish }}
        run: |
          version="$(cat VERSION)"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION ($version). Bump VERSION before tagging."
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] || [ "$PUBLISH_INPUT" = "true" ]; then push=true; else push=false; fi
          echo "tags=iksnerd/code-nexus:v$version,iksnerd/code-nexus:latest" >> "$GITHUB_OUTPUT"
          echo "push=$push" >> "$GITHUB_OUTPUT"
          echo "Image v$version, push=$push"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: steps.meta.outputs.push == 'true'
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: ${{ steps.meta.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
